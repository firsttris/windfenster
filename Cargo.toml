[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.15"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/firsttris/windfenster"
publish = false

[workspace.dependencies]
wf-core = { path = "crates/wf-core" }
wf-api = { path = "crates/wf-api" }
wf-ingest = { path = "crates/wf-ingest" }
wf-map = { path = "crates/wf-map" }
wf-alarm = { path = "crates/wf-alarm" }

anyhow = "1"
# Passwords, Argon2id
argon2 = "0.5"
axum = "0.8"
bzip2 = "0.6"
# Alarm times in the user's time zone (e-mails)
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
governor = "0.10"
# Pure Rust only: CCSDS (ECMWF) through rust-aec, no OpenJPEG or libaec to build
grib = { version = "0.19", default-features = false, features = ["ccsds-unpack-with-rust-aec", "png-unpack-with-png-crate"] }
dotenvy = "0.15"
flate2 = "1"
hex = "0.4"
# statvfs: room on the disk before a basemap download
libc = "0.2"
# Alarm e-mails over SMTP, TLS by rustls as reqwest
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
mime_guess = "2"
# Built into the binary (webauthn-rs needs OpenSSL): no system library in the image
openssl = { version = "0.10", features = ["vendored"] }
moka = { version = "0.12", features = ["future"] }
png = "0.18"
pmtiles = { version = "0.24", default-features = false, features = ["__async", "write"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"
zip = { version = "9", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
# Alarms as push messages (VAPID, aes128gcm); sent with reqwest, not its own client
web-push = { version = "0.11", default-features = false }
# Passkeys; conditional-ui for the sign-in offered by the browser's autofill
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
tempfile = "3"

# Argon2 is slow without optimisation; tests and `pnpm dev` hash passwords too.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
