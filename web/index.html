<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The theme before the first paint: the viewer's choice, else the system's (src/lib/prefs.ts). -->
    <script>
      (() => {
        var t;
        try {
          t = localStorage.getItem('wf.theme');
        } catch {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', t === 'dark');
      })();
    </script>
    <!-- The server replaces this block on station pages (title, description, Open Graph, JSON-LD). -->
    <!--wf:head-->
    <title>Windfenster</title>
    <meta
      name="description"
      content="Windfenster: Open-Source-Windvorhersage für Wassersport, mit Messstationen und dem Modell, das dort zuletzt am besten traf."
    />
    <!--/wf:head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
