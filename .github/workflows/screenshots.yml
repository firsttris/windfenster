# The pictures of the README and the documentation (docs/*.png): the app against the stand-in,
# as the browser tests run it (web/e2e/app/screenshots.spec.ts), committed when they changed.
# Run by hand after a change to the look: Actions → Update screenshots → Run workflow.
# Not the shared screenshots workflow: the app needs the server built with Rust first, which the
# Playwright image does not have.
name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build -p windfenster --locked --features embed-ui
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-server
          path: target/debug/windfenster
          retention-days: 1

  screenshots:
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its version must match @playwright/test in web/package.json, as in ci.yml
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    # Two runs at once would push on top of each other
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: screenshots-server
          path: screenshots-server
      - run: chmod +x screenshots-server/windfenster
      - run: WF_BIN="$GITHUB_WORKSPACE/screenshots-server/windfenster" pnpm screenshots
      - uses: firsttris/workflows/actions/commit-changes@v1
        with:
          paths: docs/*.png
          message: Update screenshots
