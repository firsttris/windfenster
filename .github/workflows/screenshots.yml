# The pictures of the README and the documentation (docs/*.png): the app against the stand-in,
# as the browser tests run it (web/e2e/app/screenshots.spec.ts), committed when they changed.
# Runs after every push to main that can change what they show (the app, the server, the
# stand-in data, the screenshots themselves), and by hand: Actions → Update screenshots → Run
# workflow. Its own commit is pushed with the GITHUB_TOKEN and so starts no run again.
# Not the shared screenshots workflow: the app needs the server built with Rust first, which the
# Playwright image does not have (e2e-server.yml, shared with ci.yml).
name: Update screenshots

on:
  push:
    branches: [main]
    paths:
      - web/src/**
      - web/messages/**
      - web/public/**
      - web/index.html
      - web/e2e/app/**
      - crates/**
      - pnpm-lock.yaml
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    uses: ./.github/workflows/e2e-server.yml

  # The official Playwright image of the @playwright/test version in the lockfile, as in ci.yml
  playwright-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: pnpm-lock.yaml

  screenshots:
    needs: [server, playwright-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    # Two runs at once would push on top of each other
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: e2e-server
          path: e2e-server
      - run: chmod +x e2e-server/windfenster
      - run: WF_BIN="$GITHUB_WORKSPACE/e2e-server/windfenster" pnpm screenshots
      - id: commit
        uses: firsttris/workflows/actions/commit-changes@v1
        with:
          paths: docs/*.png
          message: Update screenshots
      # A push with the GITHUB_TOKEN starts no other workflow, so the site is rebuilt from here
      - name: Rebuild the documentation with the new pictures
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docs.yml',
              ref: context.ref,
            });
