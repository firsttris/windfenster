name: Server for the browser tests

# The server the browser tests and the screenshots run against: a debug build without debug
# info and with the SPA embedded (it runs in another place than it was built), uploaded as the
# artifact `e2e-server`. Called from ci.yml and screenshots.yml, so both run the same server.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # The Ubuntu of the Playwright image (noble), whose glibc the binary must run on: built on a
    # newer one (ubuntu-latest moved to glibc 2.43) it does not start there.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Not a cache of a newer Ubuntu: its build scripts would not run here
          key: ubuntu-24.04
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build -p windfenster --locked --features embed-ui
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-server
          path: target/debug/windfenster
          retention-days: 1
