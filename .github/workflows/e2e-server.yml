name: Server for the browser tests

# The server the browser tests and the screenshots run against: a debug build without debug
# info and with the SPA embedded (it runs in another place than it was built), uploaded as the
# artifact `e2e-server`. Called from ci.yml and screenshots.yml, so both run the same server.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build -p windfenster --locked --features embed-ui
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-server
          path: target/debug/windfenster
          retention-days: 1
