name: Release

# Pushing a tag vX.Y.Z (or the "Bump version" button) publishes that version: the CI first (unless
# main's CI already passed for this code), then the shared Docker release from firsttris/workflows.
# It checks the tag against the version in Cargo.toml, builds amd64 and arm64 each on its own
# native runner, pushes :x.y.z, :x.y and :latest to Docker Hub and ghcr.io, updates the Docker Hub
# description and creates the GitHub release. Run by hand on main: the same checks, then the image
# as :edge, nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Whether main's CI already tested this code: the "Bump version" commit only changes the
  # version, so the green CI of the commit before it counts and the checks are not run again
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@ccr-161f105b-9ns022
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
    # The CI's image check keeps its build cache in ghcr.io
    permissions:
      contents: read
      packages: write

  docker:
    needs: [tested, checks]
    # The checks either passed or were not needed
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: tristanteu/windfenster
      description: Open-source wind forecast for water sports with stations, model ranking and alarms
      dockerfile: Dockerfile
      version-file: Cargo.toml
      ghcr: true
    secrets: inherit
    permissions:
      contents: write
      packages: write
