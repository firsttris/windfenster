name: CI

# Header as in firsttris/workflows (README, "CI in every project").
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  # release.yml runs the same checks before it publishes anything
  workflow_call:
  workflow_dispatch:
  # Weekly on what is on main: new clippy lints of the newest Rust, the image's base images
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          pnpm lint

      # The tests also write the ts-rs bindings. Starting from an empty folder catches
      # bindings of types that no longer exist, too.
      - name: Rust tests
        run: |
          rm -rf web/src/bindings
          cargo test --workspace --locked
      - name: ts-rs bindings match the Rust types
        run: |
          changes=$(git status --porcelain -- web/src/bindings)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- web/src/bindings
            echo "::error::web/src/bindings is out of date. Run 'cargo test --workspace' and commit the result."
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The router plugin writes the route tree during the build; the committed one must match.
      - name: Route tree is up to date
        run: git diff --exit-code -- web/src/routeTree.gen.ts

  # Whether this push touches what the image is built from beyond the code the other jobs build
  # and test: then the docker job builds it. By hand and on the weekly run always; never for a
  # release tag, whose images release.yml builds right after.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "docker=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT" in
            push) from="$BEFORE" ;;
            pull_request) from="$BASE" ;;
            *) from="" ;;
          esac
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            docker=true
          elif git diff --name-only "$from" HEAD | grep -qE '^(Dockerfile|\.dockerignore|docker/|\.cargo/|Cargo\.lock|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|web/package\.json)'; then
            docker=true
          else
            docker=false
          fi
          echo "docker=$docker" | tee -a "$GITHUB_OUTPUT"

  # The server for the browser tests' app project, built next to the checks (e2e-server.yml,
  # shared with the screenshots)
  e2e-server:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/e2e-server.yml

  # The official Playwright image of the @playwright/test version in the lockfile
  playwright-image:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: pnpm-lock.yaml

  browser:
    # The browser tests (web/e2e): the wind map's shaders on SwiftShader, and the whole app
    # against the server above, which takes everything from the outside from a local stand-in.
    # In two halves at once, in the Playwright image.
    if: ${{ !github.event.pull_request.draft }}
    needs: [e2e-server, playwright-image]
    name: browser ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.playwright-image.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: e2e-server
          path: e2e-server
      - run: chmod +x e2e-server/windfenster
      # $GITHUB_WORKSPACE is the checkout's path inside the container (github.workspace is the
      # runner's)
      - run: WF_BIN="$GITHUB_WORKSPACE/e2e-server/windfenster" pnpm e2e --shard=${{ matrix.shard }}/2
      # The pictures that differed, with their diffs, to look at or to take as the new ones
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7

  docker:
    # Build check only, when the image's own files change (see changes); release.yml publishes
    # the images. Next to the other jobs, its cache shared with the release's amd64 build in the
    # registry (ghcr.io/firsttris/windfenster-buildcache:linux-amd64, firsttris/workflows
    # actions/docker-build), which every ref can read, unlike the Actions cache.
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: firsttris/workflows/actions/docker-build@v1
        with:
          dockerfile: Dockerfile
          tags: windfenster:ci
      # The image starts on a data folder of an older version (owned by root), hands it to its
      # user and serves without root.
      - name: Start the image
        run: |
          mkdir data && sudo touch data/windfenster-old.txt && sudo chown -R root:root data
          docker run -d --name wf -p 127.0.0.1:8080:8080 -v "$PWD/data:/data" \
            -e WF_SCHEDULER=false -e WF_MAP=false windfenster:ci
          for i in $(seq 60); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          docker logs wf
          curl -fsS http://127.0.0.1:8080/api/health
          docker exec wf sh -c 'for p in /proc/[0-9]*; do grep -q "^Name:[[:space:]]*windfenster" $p/status 2>/dev/null && grep "^Uid:" $p/status; done; true' | tee uid.txt
          grep -qE '^Uid:\s+10001\s' uid.txt
          test "$(stat -c %u data/windfenster-old.txt)" = 10001
          test "$(stat -c %u data/windfenster.db)" = 10001
