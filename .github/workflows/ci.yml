name: CI

# Header as in firsttris/workflows (README, "CI in every project").
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  # release.yml runs the same checks before it publishes anything
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          pnpm lint

      # The tests also write the ts-rs bindings. Starting from an empty folder catches
      # bindings of types that no longer exist, too.
      - name: Rust tests
        run: |
          rm -rf web/src/bindings
          cargo test --workspace --locked
      - name: ts-rs bindings match the Rust types
        run: |
          changes=$(git status --porcelain -- web/src/bindings)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- web/src/bindings
            echo "::error::web/src/bindings is out of date. Run 'cargo test --workspace' and commit the result."
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The router plugin writes the route tree during the build; the committed one must match.
      - name: Route tree is up to date
        run: git diff --exit-code -- web/src/routeTree.gen.ts

  # The server for the browser tests' app project, built next to the checks (e2e-server.yml,
  # shared with the screenshots)
  e2e-server:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/e2e-server.yml

  browser:
    # The browser tests (web/e2e): the wind map's shaders on SwiftShader, and the whole app
    # against the server above, which takes everything from the outside from a local stand-in.
    # In the official Playwright image; its version must match @playwright/test in
    # web/package.json.
    if: ${{ !github.event.pull_request.draft }}
    needs: e2e-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: e2e-server
          path: e2e-server
      - run: chmod +x e2e-server/windfenster
      # $GITHUB_WORKSPACE is the checkout's path inside the container (github.workspace is the
      # runner's)
      - run: WF_BIN="$GITHUB_WORKSPACE/e2e-server/windfenster" pnpm e2e
      # The pictures that differed, with their diffs, to look at or to take as the new ones
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  docker:
    # Build check only; release.yml publishes the images
    if: ${{ !github.event.pull_request.draft }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=linux-amd64
          load: true
          tags: windfenster:ci
      # The image starts on a data folder of an older version (owned by root), hands it to its
      # user and serves without root.
      - name: Start the image
        run: |
          mkdir data && sudo touch data/windfenster-old.txt && sudo chown -R root:root data
          docker run -d --name wf -p 127.0.0.1:8080:8080 -v "$PWD/data:/data" \
            -e WF_SCHEDULER=false -e WF_MAP=false windfenster:ci
          for i in $(seq 60); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          docker logs wf
          curl -fsS http://127.0.0.1:8080/api/health
          docker exec wf sh -c 'for p in /proc/[0-9]*; do grep -q "^Name:[[:space:]]*windfenster" $p/status 2>/dev/null && grep "^Uid:" $p/status; done; true' | tee uid.txt
          grep -qE '^Uid:\s+10001\s' uid.txt
          test "$(stat -c %u data/windfenster-old.txt)" = 10001
          test "$(stat -c %u data/windfenster.db)" = 10001
