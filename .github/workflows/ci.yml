name: CI

# Header as in firsttris/workflows (README, "CI in every project").
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  # release.yml runs the same checks before it publishes anything
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          pnpm lint

      # The tests also write the ts-rs bindings. Starting from an empty folder catches
      # bindings of types that no longer exist, too.
      - name: Rust tests
        run: |
          rm -rf web/src/bindings
          cargo test --workspace --locked
      - name: ts-rs bindings match the Rust types
        run: |
          changes=$(git status --porcelain -- web/src/bindings)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- web/src/bindings
            echo "::error::web/src/bindings is out of date. Run 'cargo test --workspace' and commit the result."
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    # Build check only; release.yml publishes the images
    if: ${{ !github.event.pull_request.draft }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=linux-amd64
